# One compose file for the whole project: app (postgres + api + webapp)
# and Airflow (init + api-server + dag-processor + scheduler); ONE postgres
# instance hosts two databases: the app data and Airflow metadata (brief rule).
#
#   cp .env.example .env    # fill in the values
#   docker compose up -d --build

# Shared config for all Airflow services (YAML anchor, reused via <<:)
x-airflow-common: &airflow-common
  build: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow's bookkeeping lives in the SAME postgres instance but a SEPARATE
    # database ("airflow" vs the app's) - single instance per the course brief.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8021/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    # Airflow Connection to the APP database (used by save_statistics)
    AIRFLOW_CONN_APP_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # the prediction DAG calls the API by service name
    API_URL: http://api:8000
    # MLflow tracking server + model registry (training DAG)
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-f1-top10}
    TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    ML_ALERTS_WEBHOOK_URL: ${ML_ALERTS_WEBHOOK_URL:-}
    DATA_DOCS_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/data-docs
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./airflow/great_expectations:/opt/airflow/great_expectations

services:

  # ---------- app ----------

  postgres:
    build:
      context: ./airflow
      dockerfile: postgres.Dockerfile
    container_name: f1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    # no host port: only containers talk to the database (brief: expose only
    # externally used services). Inspect it with:
    #   docker compose exec postgres psql -U $POSTGRES_USER -d $POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: model_service/Dockerfile
    container_name: f1_api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # model registry: the API serves models:/<name>@champion
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-f1-top10}
      # fail fast when MLflow is unreachable: no retries, 10 s timeout
      # (default retries with backoff took over 4 minutes to give a 503)
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  webapp:
    build:
      context: ./webapp
    container_name: f1_webapp
    restart: unless-stopped
    environment:
      # service name, not localhost: containers reach each other by name
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./webapp:/app
    depends_on:
      api:
        condition: service_healthy

  # ---------- monitoring and edge proxy ----------

  grafana:
    image: grafana/grafana:11.3.0
    container_name: f1_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # contact points: Data Quality Alerts and ML Alerts Teams channels.
      # Grafana refuses to start with an empty contact point URL, hence the
      # placeholder when a webhook is not set in .env
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-http://localhost/teams-webhook-not-set}
      ML_ALERTS_WEBHOOK_URL: ${ML_ALERTS_WEBHOOK_URL:-http://localhost/teams-webhook-not-set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: f1_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./airflow/great_expectations:/srv/great-expectations:ro
    depends_on:
      api:
        condition: service_started
      webapp:
        condition: service_started
      grafana:
        condition: service_healthy
  # ---------- mlflow ----------

  # tracking server + model registry. Run/registry metadata in SQLite and
  # model artifacts on named volumes; clients upload/download artifacts
  # through the server (--serve-artifacts), so they need no shared disk.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    container_name: f1_mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/db/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000}
    volumes:
      - mlflow_db:/mlflow/db
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      # the image has python but no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- airflow ----------

  # one-shot: run Airflow DB migrations, then exit
  airflow-init:
    <<: *airflow-common
    command: airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: airflow api-server --port 8021
    restart: unless-stopped
    ports:
      - "8021:8021"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy
        # ---------- data feeder ----------

  feeder:
    build:
      context: .
      dockerfile: feeder/Dockerfile
    container_name: f1_feeder
    restart: unless-stopped
    environment:
      FEEDER_SOURCE_CSV: /app/data/inference.csv
      FEEDER_RAW_DIR: /app/data/raw_data
      FEEDER_BATCH_SIZE: ${FEEDER_BATCH_SIZE:-20}
      FEEDER_INTERVAL_SECONDS: ${FEEDER_INTERVAL_SECONDS:-60}
      DRIFT_MODE: ${DRIFT_MODE:-false}
      # per-row probability of each error type, per-file probability of a
      # missing column (low, so the data-quality alerts stay quiet normally)
      FEEDER_ERROR_PROB: ${FEEDER_ERROR_PROB:-0.015}
      FEEDER_MISSING_COLUMN_PROB: ${FEEDER_MISSING_COLUMN_PROB:-0.005}
    volumes:
      - ./data:/app/data
    depends_on:
      airflow-scheduler:
        condition: service_started

volumes:
  postgres_data:
  mlflow_db:
  mlflow_artifacts:
  grafana_data:
