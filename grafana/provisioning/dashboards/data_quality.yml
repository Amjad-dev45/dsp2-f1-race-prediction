apiVersion: 1

providers:
  - name: F1 Data Quality Dashboard
    orgId: 1
    folder: F1 Data Quality
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/data-quality
      foldersFromFilesStructure: false
