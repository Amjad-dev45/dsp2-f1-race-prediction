apiVersion: 1

datasources:
  - name: F1 Postgres
    type: grafana-postgresql-datasource
    uid: f1_postgres_ds
    access: proxy
    url: postgres:5432
    user: $__env{POSTGRES_USER}
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      database: $__env{POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
